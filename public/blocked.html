<!doctype html>
<html lang="en" data-surface="blocked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="blocked-shell">
      <section class="blocked-panel" aria-labelledby="blocked-title">
        <img
          class="blocked-mark"
          src="icons/icon-128.png"
          alt=""
          aria-hidden="true"
        />
        <h1 id="blocked-title">Checking this rule…</h1>
        <p class="blocked-site" id="blocked-site"></p>
        <p class="blocked-reset" id="blocked-reset"></p>
        <hr />

        <div class="blocked-actions">
          <button class="button primary" id="go-back" type="button">
            Leave for now
          </button>
        </div>

        <section id="override-section" hidden>
          <p class="pass-note">
            A 10-minute emergency override is available. Pause for 15 seconds,
            then describe what you intend to do in at least 50 characters.
          </p>
          <label class="field intention-field">
            <span>What do you intend to do?</span>
            <textarea
              id="intention"
              rows="3"
              maxlength="240"
              inputmode="text"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="true"
              placeholder="For example: check one email, then leave"
            ></textarea>
            <span class="intention-meta">
              <span>Your intention is not saved.</span>
              <span id="intention-count">0 / 50</span>
            </span>
          </label>
          <button
            class="button secondary"
            id="continue-override"
            type="button"
            disabled
          >
            Continue
          </button>
        </section>
        <p class="form-error centered" id="blocked-error" role="alert"></p>

        <dialog
          class="confirmation-dialog"
          id="override-confirmation"
          aria-labelledby="confirmation-title"
          aria-describedby="confirmation-description"
        >
          <div class="confirmation-panel">
            <h2 id="confirmation-title">Are you sure?</h2>
            <p id="confirmation-description">
              Type this code exactly to start 10 minutes of access.
            </p>
            <output class="confirmation-code" id="override-code"></output>
            <label class="field">
              <span>Confirmation code</span>
              <input
                id="confirmation-code"
                type="text"
                maxlength="5"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
            </label>
            <p class="form-error" id="confirmation-error" role="alert"></p>
            <div class="confirmation-actions">
              <button
                class="button secondary"
                id="cancel-confirmation"
                type="button"
              >
                Cancel
              </button>
              <button
                class="button primary"
                id="confirm-override"
                type="button"
              >
                Confirm override
              </button>
            </div>
          </div>
        </dialog>
      </section>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
