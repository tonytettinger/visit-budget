<!doctype html>
<html lang="en" data-surface="blocked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="blocked-shell">
      <section class="blocked-panel" aria-labelledby="blocked-title">
        <img
          class="blocked-mark"
          src="icons/icon-128.png"
          alt=""
          aria-hidden="true"
        />
        <h1 id="blocked-title">Checking this rule…</h1>
        <p class="blocked-site" id="blocked-site"></p>
        <p class="blocked-reset" id="blocked-reset"></p>
        <hr />

        <div class="blocked-actions">
          <button class="button primary" id="go-back" type="button">
            Leave for now
          </button>
        </div>

        <section id="pass-section" hidden>
          <p class="pass-note">
            One 10-minute pass remains. It starts after a 15-second pause.
          </p>
          <label class="field intention-field">
            <span>What do you intend to do?</span>
            <textarea
              id="intention"
              rows="3"
              maxlength="240"
              inputmode="text"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="true"
              placeholder="For example: check one email, then leave"
            ></textarea>
          </label>
          <button class="button secondary" id="use-pass" type="button" disabled>
            Use emergency pass
          </button>
        </section>
        <p class="form-error centered" id="blocked-error" role="alert"></p>
      </section>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
