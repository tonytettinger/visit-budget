<!doctype html>
<html lang="en" data-surface="blocked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="blocked-shell">
      <section class="blocked-panel" aria-labelledby="blocked-title">
        <img
          class="blocked-mark"
          src="icons/icon-128.png"
          alt=""
          aria-hidden="true"
        />
        <h1 id="blocked-title">Checking this rule…</h1>
        <p class="blocked-site" id="blocked-site"></p>
        <p class="blocked-reset" id="blocked-reset"></p>
        <hr />

        <div class="blocked-actions">
          <button class="button primary" id="go-back" type="button">
            Leave for now
          </button>
        </div>

        <section id="override-section" hidden>
          <p class="override-warning">Before you override</p>
          <p class="pass-note">
            Take a moment before reopening this site. If you continue, choose
            the shortest amount of temporary access you need.
          </p>
          <p
            class="pause-countdown"
            id="pause-countdown"
            role="status"
            aria-live="polite"
          ></p>
          <div
            class="override-duration"
            role="group"
            aria-labelledby="override-duration-label"
          >
            <span id="override-duration-label">Temporary access</span>
            <div class="duration-picker">
              <div class="duration-case">
                <select id="override-tens" aria-label="Tens of minutes">
                  <option value="0">0</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                  <option value="6">6</option>
                </select>
                <span aria-hidden="true"></span>
                <select id="override-ones" aria-label="Ones of minutes">
                  <option value="0">0</option>
                  <option value="5" selected>5</option>
                </select>
              </div>
              <span>minutes</span>
            </div>
          </div>
          <button
            class="button secondary"
            id="continue-override"
            type="button"
            disabled
          >
            Override for 5 minutes
          </button>
        </section>
        <p class="form-error centered" id="blocked-error" role="alert"></p>

        <dialog
          class="confirmation-dialog"
          id="override-confirmation"
          aria-labelledby="confirmation-title"
          aria-describedby="confirmation-description"
        >
          <div class="confirmation-panel">
            <h2 id="confirmation-title">Are you sure?</h2>
            <p id="confirmation-description">
              Type this code exactly to start temporary access.
            </p>
            <output class="confirmation-code" id="override-code"></output>
            <label class="field">
              <span>Confirmation code</span>
              <input
                id="confirmation-code"
                type="text"
                maxlength="5"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
              />
            </label>
            <p class="form-error" id="confirmation-error" role="alert"></p>
            <div class="confirmation-actions">
              <button
                class="button secondary"
                id="cancel-confirmation"
                type="button"
              >
                Cancel
              </button>
              <button
                class="button primary"
                id="confirm-override"
                type="button"
              >
                Confirm override
              </button>
            </div>
          </div>
        </dialog>
      </section>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
