<!doctype html>
<html lang="en" data-surface="popup">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visit Budget</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <img
            class="brand-mark"
            src="icons/icon-48.png"
            alt=""
            aria-hidden="true"
          />
          <span>Visit Budget</span>
        </div>
        <button
          class="icon-button"
          id="open-settings-icon"
          type="button"
          aria-label="Open settings"
          title="Open settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 8.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Zm8 3.8-.1-1.3 2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.2-1.3L15 3h-4l-.3 2.5a8 8 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.5L6 12l.1 1.3-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2.2 1.3L11 21h4l.3-2.5a8 8 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.5L20 12Z"
            />
          </svg>
        </button>
      </header>

      <section id="popup-content" aria-live="polite">
        <div class="loading-line">Reading this site…</div>
      </section>

      <footer class="privacy-note">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="11" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
        Your data stays on your device.
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
